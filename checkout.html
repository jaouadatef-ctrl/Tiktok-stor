<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المتابعين - تيك توك</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; direction: rtl; text-align: center; }
        .container { max-width: 420px; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h1 { color: #111; font-size: 22px; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .package-box { background: #f9f9fb; border: 2px solid #0070ba; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .package-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .package-price { font-size: 22px; font-weight: bold; color: #0070ba; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; font-size: 14px; color: #333; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; text-align: left; direction: ltr; }
        .btn-pay { display: block; width: 100%; background: #0070ba; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; text-align: center; margin-top: 15px; }
        .btn-pay:hover { background: #005ea6; }
    </style>
</head>
<body>

<div class="container">
    <h1>متجر المتابعين</h1>
    <p>احصل على متابعين حقيقيين لحسابك على تيك توك بكل سهولة وأمان.</p>

    <div class="package-box">
        <div class="package-title">باقتك المتاحة</div>
        <div class="package-price">USD 10.00</div>
    </div>

    <div class="form-group">
        <label>أدخل اسم المستخدم (TikTok Username):</label>
        <input type="text" id="tiktokUser" placeholder="username">
    </div>

    <!-- زر الدفع المباشر برابط PayPal الخاص بك -->
    <a href="https://www.paypal.com/ncp/payment/ANWTXUFT85USQ" onclick="return validateUser()" class="btn-pay">ادفع الآن (PayPal / بطاقة)</a>
</div>

<script>
    function validateUser() {
        var username = document.getElementById('tiktokUser').value;
        if(username.trim() === "") {
            alert("المرجو إدخال اسم المستخدم في تيك توك أولاً!");
            return false;
        }
        return true;
    }
</script>

</body>
</html>
