<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الدفع - متجر المتابعين</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; direction: rtl; text-align: center; }
        .container { max-width: 420px; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #222; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .btn-pay { display: block; width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-card { background: #0070ba; color: white; }
        .btn-card:hover { background: #005ea6; }
        .btn-paypal { background: #ffc439; color: #111; }
        .btn-paypal:hover { background: #f4b827; }
        .secure-text { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>اختر طريقة الدفع</h2>
    <p>أنت على وشك إتمام طلب باقة المتابعين الخاصة بك بكل أمان.</p>

    <!-- زر الدفع بالبطاقة البنكية (يمكنك ربطه برابط Stripe أو بوابتك البنكية) -->
    <a href="#" class="btn-pay btn-card">الدفع بالبطاقة البنكية (Credit Card)</a>

    <!-- زر الدفع بـ PayPal (يمكنك استبداله برابط الدفع الخاص بـ PayPal) -->
    <a href="#" class="btn-pay btn-paypal">الدفع عبر PayPal</a>

    <div class="secure-text">🔒 عملية دفع مشفرة وآمنة 100%</div>
</div>

</body>
</html>
