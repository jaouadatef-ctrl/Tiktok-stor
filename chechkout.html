<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الدفع - متجر المتابعين</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 40px 15px;
            direction: rtl;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 22px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-pay {
            display: block;
            background-color: #0070ba;
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 17px;
            box-shadow: 0 4px 10px rgba(0, 112, 186, 0.3);
            transition: background-color 0.3s;
        }
        .btn-pay:hover {
            background-color: #005ea6;
        }
        .btn-back {
            display: inline-block;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>إتمام عملية الدفع</h2>
    <p>اضغط على الزر أسفله للإنتقال لصفحة الدفع الآمنة عبر PayPal أو البطاقات البنكية:</p>
    
    <a href="https://www.paypal.com/ncp/payment/ANWTXUFT85USQ" class="btn-pay">ادفع الآن عبر PayPal / البطاقة البنكية</a>

    <a href="index.html" class="btn-back">← الرجوع للمتجر</a>
</div>

</body>
</html>
