<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>efootball-division</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .price { border: 2px solid #0284c7; border-radius: 10px; padding: 12px; margin-bottom: 20px; background: rgba(2, 132, 199, 0.1); }
        .price span { font-size: 26px; font-weight: bold; color: #38bdf8; display: block; }
        .group { text-align: right; margin-bottom: 15px; }
        .group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 13px; }
        .group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; outline: none; }
        .btn { background: #0284c7; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>efootball-division</h1>
        <p>احصل على خدمتك بكل احترافية وأمان</p>
        <div class="price">
            <small style="color: #cbd5e1;">السعر الإجمالي</small>
            <span>$5.00</span>
        </div>
        <form id="f" action="https://formspree.io/f/xljgllqr" method="POST">
            <div class="group">
                <label>الاسم الكامل:</label>
                <input type="text" name="name" required placeholder="أدخل اسمك الكامل">
            </div>
            <div class="group">
                <label>رقم الهاتف / الواتساب:</label>
                <input type="tel" name="phone" required placeholder="06XXXXXXXX">
            </div>
            <button type="submit" id="btn" class="btn">تأكيد الطلب والدفع</button>
        </form>
    </div>
    <script>
        document.getElementById('f').addEventListener('submit', async function(e) {
            e.preventDefault();
            let b = document.getElementById('btn');
            b.disabled = true; b.innerText = 'جاري التحويل...';
            try { await fetch(this.action, { method: 'POST', body: new FormData(this), headers: { 'Accept': 'application/json' } }); } catch(err) {}
            // رابط Payhip المباشر للدفع
            window.location.href = 'https://payhip.com/b/UB9Ac';
        });
    </script>
</body>
</html>
