<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر متابعين تيك توك</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 30px 15px;
            direction: rtl;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #0070ba;
        }
        .package-card {
            background: #f9f9fb;
            border: 2px solid #e1e1e8;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .package-title {
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }
        .package-price {
            color: #0070ba;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn-buy {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-buy:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>متجر المتابعين</h1>
    <p>احصل على متابعين حقيقيين لحسابك على تيك توك بكل سهولة وأمان.</p>

    <!-- نموذج إدخال اسم المستخدم -->
    <form onsubmit="redirectToCheckout(event)">
        <div class="form-group">
            <label for="tiktok-username">أدخل اسم المستخدم (TikTok Username):</label>
            <input type="text" id="tiktok-username" placeholder="@username" required>
        </div>

        <!-- باقة المتابعين -->
        <div class="package-card">
            <div class="package-title">باقة 1000 متابع</div>
            <div class="package-price">10.00 USD</div>
        </div>

        <button type="submit" class="btn-buy">شراء الآن والدفع</button>
    </form>
</div>

<script>
    function redirectToCheckout(event) {
        event.preventDefault();
        const username = document.getElementById('tiktok-username').value;
        // حفظ اسم المستخدم مؤقتاً فالمتصفح باش نقدروا نعرفوه فصفحة الدفع ولا فالبackend
        localStorage.setItem('tiktok_user', username);
        // التوجيه لصفحة الدفع
        window.location.href = 'checkout.html';
    }
</script>

</body>
</html>
