<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>efootball-division</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .price-box {
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            background: rgba(2, 132, 199, 0.1);
        }

        .price-title {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .price-amount {
            font-size: 32px;
            font-weight: 800;
            color: #38bdf8;
        }

        .btn {
            display: block;
            background-color: #0284c7;
            color: #ffffff;
            text-decoration: none;
            width: 100%;
            padding: 16px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        .btn:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>efootball-division</h1>
        <p>احصل على خدمتك بكل احترافية وأمان</p>
        
        <div class="price-box">
            <div class="price-title">السعر الإجمالي</div>
            <div class="price-amount">USD 3.40</div>
        </div>

        <a href="https://docs.google.com/forms/d/19bWZ3tvLePFMRxIWQt4MiZp_VG10GnCouWfDm0AtwEg/viewform" target="_blank" class="btn">تأكيد الطلب</a>
    </div>

</body>
</html>
