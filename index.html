<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>efootball-division</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; font-size: 28px; margin-bottom: 12px; font-weight: bold; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 25px; }
        .price-box {
            border: 2px solid #0284c7;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            background: rgba(2, 132, 199, 0.1);
        }
        .price-amount { font-size: 30px; font-weight: bold; color: #38bdf8; }
        .payment-methods {
            font-size: 13px;
            color: #cbd5e1;
            margin-top: 8px;
        }
        .input-group { text-align: right; margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 14px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .btn {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px 0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>efootball-division</h1>
        <p>احصل على خدمتك بكل احترافية وأمان</p>
        
        <div class="price-box">
            <div style="font-size: 14px; color: #cbd5e1;">السعر الإجمالي</div>
            <div class="price-amount">3 MAD</div>
            <div class="payment-methods">💳 الدفع عبر البطاقة البنكية أو PayPal</div>
        </div>

        <form action="https://formspree.io/f/xljgllqr" method="POST">
            
            <!-- تم تعديل المبلغ إلى 3MAD في رابط التوجيه -->
            <input type="hidden" name="_next" value="https://paypal.me/رابط_بايپال_ديالك/3MAD">

            <div class="input-group">
                <label>الاسم الكامل:</label>
                <input type="text" name="name" required placeholder="أدخل اسمك الكامل">
            </div>

            <div class="input-group">
                <label>رقم الهاتف / الواتساب:</label>
                <input type="tel" name="phone" required placeholder="06XXXXXXXX">
            </div>

            <button type="submit" class="btn">تأكيد الطلب والدفع</button>
        </form>
    </div>

</body>
</html>
