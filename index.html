<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>efootball-division</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .price-box {
            border: 2px solid #0056b3;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: #f0f7ff;
        }
        .price-box span {
            font-size: 22px;
            font-weight: bold;
            color: #0056b3;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #444;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #0056b3;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #004085;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>efootball-division</h1>
        <p>احصل على خدمتك بكل احترافية وأمان</p>
        
        <div class="price-box">
            <div>السعر الإجمالي</div>
            <span>USD 3.40</span>
        </div>

        <div class="input-group">
            <label for="fullname">الاسم الكامل:</label>
            <input type="text" id="fullname" placeholder="أدخل اسمك هنا...">
        </div>

        <div class="input-group">
            <label for="phone">رقم الهاتف:</label>
            <input type="tel" id="phone" placeholder="أدخل رقم هاتفك هنا...">
        </div>

        <button class="btn">تأكيد الطلب</button>
    </div>

</body>
</html>
